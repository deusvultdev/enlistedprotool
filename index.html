<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enlisted Ultimate Tool — Project crafted by Deus_Vult</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--p:#161b22;--p2:#1f2733;--b:#30363d;--t:#e6edf3;--m:#8b949e;--c0:#10b981;--c1:#ef4444;--c2:#6366f1;--c3:#f59e0b;--a:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--t);padding:12px 12px 90px;font-size:13.5px}
header,.panel,.bar{background:var(--p);border:1px solid var(--b);border-radius:10px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{cursor:pointer;color:var(--t);background:var(--p2);border:1px solid var(--b);border-radius:6px;padding:6px 10px;font-weight:600;font-size:.78rem}
button.on{background:var(--a);border-color:var(--a)}
select,input[type=text],input[type=number]{background:#090d11;color:var(--t);border:1px solid var(--b);padding:5px 8px;border-radius:6px;font-size:.8rem}
.bar{padding:9px 12px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar label,.m{color:var(--m);font-size:.75rem}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--p);border:1px solid var(--b);border-top:4px solid var(--b);border-radius:8px;padding:10px}
.card select{width:100%;margin-bottom:6px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:.74rem;color:var(--m);background:var(--bg);padding:6px;border-radius:6px}
.meta b{color:var(--t)}
.ws{display:grid;grid-template-columns:320px 1fr 330px;gap:12px}
@media(max-width:1280px){.ws{grid-template-columns:310px 1fr}.tp{grid-column:1/-1}}
@media(max-width:860px){.ws,.tg{grid-template-columns:1fr!important}}
.panel{padding:12px}
h3{font-size:.86rem;margin:6px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--b)}
.hb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.hb button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:4px;background:var(--bg);line-height:1.15;text-align:center}
.hb button span{font-size:.72rem;font-weight:600}
.hb button b{font-size:.95rem}
.hb button.on{background:#143327;border-color:var(--c0)}
.mr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed #212934;font-size:.79rem;gap:6px}
canvas{max-width:100%}
#chart{width:100%;height:300px;background:var(--bg);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.76rem;margin-top:8px}
th,td{padding:5px 6px;border-bottom:1px solid #212934;text-align:center}th{color:var(--m)}td:first-child,th:first-child{text-align:left}
#tgt{display:block;width:100%;border-radius:10px;border:1px solid #3d4f68;cursor:crosshair;box-shadow:inset 0 0 30px #000a}
#tank{background:#d6c4a0;border-radius:6px;border:2px solid #5c4938;cursor:crosshair}
.sunw{position:relative;display:inline-block}
.sun{width:36px;height:36px;cursor:pointer;display:block;transition:transform .3s;--sc:#64748b;--sg:#0000}
.sun svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px var(--sg))}
.sun .rays{transform-origin:20px 20px;animation:sunspin 28s linear infinite}.sun .rays line{stroke:var(--sc);stroke-width:2.2;stroke-linecap:round}
.sun .core{fill:var(--sc)}.sun .dot{display:none;fill:#22c55e;stroke:#0d1117;stroke-width:1.5}
.sun.ok{--sc:#fbbf24;--sg:#fbbf2499}.sun.new{--sc:#fb923c;--sg:#fb923cbb;animation:sunpulse 1.7s ease-in-out infinite}.sun.new .dot{display:block}
.sun.idle{--sc:#64748b;opacity:.75}.sun.checking .rays{animation-duration:2.6s}.sun:hover{transform:scale(1.1)}
.tip{position:absolute;top:44px;right:0;z-index:30;width:270px;background:var(--p);border:1px solid var(--b);border-radius:10px;padding:10px 12px;font-size:.76rem;line-height:1.55;box-shadow:0 12px 30px #000b}
.tip[hidden]{display:none}.tip b{color:var(--t)}
@keyframes sunspin{to{transform:rotate(360deg)}}@keyframes sunpulse{50%{transform:scale(1.14)}}
@media(prefers-reduced-motion:reduce){.sun .rays,.sun.new{animation:none}}
details{margin-top:8px;font-size:.76rem;color:var(--m)}details input{width:72px}.pre button{padding:3px 9px}
#tank{background:#11171d;border:1px solid var(--b)}
.tg{display:grid;grid-template-columns:340px 1fr 340px;gap:12px}
.box{padding:10px;border-radius:8px;border:1px solid var(--b);background:var(--bg);margin-top:8px;line-height:1.5;font-size:.8rem}
.corner{pointer-events:none;opacity:.92;position:fixed;bottom:14px;right:14px;z-index:9;display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,#14171c,#241012);border:2px solid #7f1d1d;box-shadow:0 8px 24px #000c;padding:7px 14px 7px 8px;border-radius:12px;user-select:none}
.corner div{width:54px;height:54px;border-radius:8px;overflow:hidden;border:2px solid #52525b}.corner img{width:100%;height:100%;object-fit:cover;display:block}
.corner span{font-family:'Pirata One',Georgia,serif;font-size:1.35rem;color:#ef4444;white-space:nowrap;text-shadow:1px 1px 0 #000}
/* --- layout fixes: no horizontal overflow on phones / wide screens --- */
.ws>*,.tg>*,.grid4>*{min-width:0}
.panel{overflow-x:auto}
.tp select,.tp input[type=number]{max-width:100%}
.tp .row select{flex:1 1 100%;min-width:0}
.tp table{font-size:.7rem}.tp th,.tp td{padding:4px 3px}
@media(max-width:600px){body{padding:8px 8px 70px}
 .corner{bottom:8px;right:8px;padding:4px 10px 4px 5px;gap:7px;opacity:.85}.corner div{width:32px;height:32px}.corner span{font-size:.95rem}
 #chart{height:240px}table{font-size:.66rem}th,td{padding:4px 3px}}
</style>
</head>
